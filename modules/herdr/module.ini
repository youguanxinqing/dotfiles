[module]
platforms = all
enabled = true
order = 90

[dependency herdr]
command = herdr
installer = brew
source = herdr

[dependency herdr-plugins]
command = herdr
installer = script
source = install.sh

[link config]
mode = copy
source = configs/herdr/config.toml
target = ~/.config/herdr/config.toml

[link plugin-config]
mode = overlay
source = configs/herdr/plugins/config
target = ~/.config/herdr/plugins/config
