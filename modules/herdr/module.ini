[module]
platforms = all
enabled = true
order = 90

[dependency herdr]
command = herdr
installer = brew
source = herdr

[dependency herdr-plugins]
command = herdr
installer = script
source = install.sh

# copy 而不是软链：herdr config reset-keys 是就地写，不走 rename，
# 所以软链不会断——它会直接写穿到仓库里，把 [keys] 和所有 [[keys.command]]
# 删掉（实测 9.7K -> 2.5K），而它自己那份 .bak 还落在 ~/.config 那侧。
# 换句话说软链等于把 git 工作区的写权限交给 herdr。
# 不是因为 herdr 不支持 include —— 那只排除 entry 模式，排除不了软链。
[link config]
mode = copy
source = configs/herdr/config.toml
target = ~/.config/herdr/config.toml

[link plugin-config]
mode = overlay
source = configs/herdr/plugins/config
target = ~/.config/herdr/plugins/config
