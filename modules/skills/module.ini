[module]
platforms = all
enabled = true
# After bin (50): post-links.sh runs skills-mirror, which wants ~/.local/bin
# already populated on a machine where the repo copy is not on PATH.
order = 55

# One target, not one per agent. ~/.agents/skills is the cross-agent standard
# root — Codex reads it natively as its USER scope, `npx skills` installs there —
# so a skill only ever lands in one place. Claude's copy is derived from it by
# post-links.sh, never linked separately, which is what keeps the two agents
# showing the same skill set.
#
# Overlay links per file through `git ls-files --exclude-standard`, so an
# untracked or ignored skill cannot reach an agent root by accident.
[link skills]
mode = overlay
source = skills
target = ~/.agents/skills
