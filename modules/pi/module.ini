[module]
platforms = all
enabled = true
# pi 本体是 fnm 那份 node 的全局 npm 包，得排在 node（20）后面。
order = 30

[dependency pi]
command = pi
installer = npm
source = @earendil-works/pi-coding-agent

[dependency pi-packages]
command = pi
installer = script
source = install.sh

# home/.pi/agent/open-tui.json 是软链：没有本机路径，而且只会被就地写（open-tui
# 设置面板用 writeFileSync，不走 rename），面板里改的偏好直接落成仓库里的 diff。
#
# models.json 不链接：magpie 等本机代理会往里写自己的模型表（上千行、指向
# 127.0.0.1），链接会把这些本机状态带进公开仓库。仓库里的 models.json 只是种子，
# post-links.sh 在目标不存在时复制一份，之后归这台机器。
#
# 种子不带 apiKey。密钥在 ~/.pi/agent/auth.json（pi 自己的凭据库，
# /login 写的就是它），而 auth.json 里的凭据优先级本来就高于 models.json 的 apiKey。
# 新机器上 /login 选 deepseek 填一次 key 即可。
#
# settings.json 不进仓库：pi 会写回 lastChangelogVersion 和 /model 选的默认模型，
# 链接或 copy 它都会天天漂移。扩展包的声明交给 install.sh 用 pi 自己的命令维护。
#
# extensions/clear.ts 把 pi 的 /new 再挂一个 /clear 的名字：Claude Code、Codex 都是
# /clear，一个词对一件事，省掉按工具切换的记忆负担。它是仓库里的文件而不是 npm 包，
# 所以跟着 pi 模块一起落到新机器（home/ 覆盖链接，无需登记），改完在 pi 里 /reload 生效。
