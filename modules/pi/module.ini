[module]
platforms = all
enabled = true
# pi 本体是 fnm 那份 node 的全局 npm 包，得排在 node（20）后面。
order = 30

[dependency pi]
command = pi
installer = npm
source = @earendil-works/pi-coding-agent

[dependency pi-packages]
command = pi
installer = script
source = install.sh

# home/.pi/agent 下是软链：models.json 和 open-tui.json 都没有本机路径，
# 而且只会被就地写（open-tui 设置面板用 writeFileSync，不走 rename），
# 面板里改的偏好直接落成仓库里的 diff，正好拿来 commit。
#
# models.json 不带 apiKey。密钥在 ~/.pi/agent/auth.json（pi 自己的凭据库，
# /login 写的就是它），而 auth.json 里的凭据优先级本来就高于 models.json 的 apiKey。
# 新机器上 /login 选 deepseek 填一次 key 即可。
#
# settings.json 不进仓库：pi 会写回 lastChangelogVersion 和 /model 选的默认模型，
# 链接或 copy 它都会天天漂移。扩展包的声明交给 install.sh 用 pi 自己的命令维护。
