[module]
platforms = all
enabled = true
order = 20

[dependency cargo]
command = cargo
installer = rustup
source = stable

# cargo-local：在有 .cargo-local 的 worktree 里把 git 依赖换成本地 checkout，见脚本开头。
# 不进 ~/.local/bin —— 它叫 cargo，放进全局 PATH 就接管了所有项目；由各项目的
# .envrc 用 `PATH_add ~/.local/libexec/cargo-local` 按目录启用。
# 不用 home/ 覆盖：.gitignore 的 **/*.local 会把 home/.local 整个吞掉。
[link cargo-local]
mode = tree
source = modules/cargo/cargo-local
target = ~/.local/libexec/cargo-local
