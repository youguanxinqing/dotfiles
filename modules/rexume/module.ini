# rexume 在 Rex server 重启后，把 Claude Code、Codex、Pi 的对话重新开回 Rex 恢复的
# pane 里。它装在跑 Rex server 的那台机器上。
#
# macOS 走 Homebrew（tap 只发 Apple Silicon + Sequoia 的 bottle）。NixOS 不走这里：
# nix/packages.nix 打包 Linux 静态版，Home Manager 装进 profile。
#
# 排在 claude、codex(50)、pi(30)、skills(55) 之后：rexume install 只给已经存在的
# 运行时目录写 hook，先装它会漏掉后来才出现的那个。
[module]
platforms = macos
enabled = true
order = 90

[dependency rexume]
command = rexume
installer = brew
source = entwining/tap/rexume
