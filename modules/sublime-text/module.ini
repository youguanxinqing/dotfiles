[module]
platforms = macos
enabled = true
order = 50

# 装 app（缺了就走 cask）并把 subl 链到 ~/.local/bin，见 install.sh 里的原因。
[dependency sublime-text]
platform = macos
command = subl
installer = script
source = install.sh

# Format It 命令的 SQL 分支直接把选区管道给 pg_format，见 format_it.py。
[dependency pgformatter]
platform = macos
command = pg_format
installer = brew
source = pgformatter

# Paste Image 把剪贴板里的图片落盘，靠的是 pngpaste，见 paste_image.py。
# 插件里不写死 /opt/homebrew/bin，所以这条声明就是新机器上那个命令存在的唯一保证。
[dependency pngpaste]
platform = macos
command = pngpaste
installer = brew
source = pngpaste

# 不用 home/ 覆盖：那条路径 5 层深，每个插件文件都要把
# `home/Library/Application Support/Sublime Text/Packages/User/` 重抄一遍。
# overlay 而不是 tree —— Sublime 自己往 Packages/User 里写 .sublime-settings
# 和 Package Control 的状态，整目录接管会把它们挡在外面。
[link packages-user]
platform = macos
mode = overlay
source = modules/sublime-text/packages-user
target = ~/Library/Application Support/Sublime Text/Packages/User
