[module]
platforms = macos
enabled = true
order = 10

[dependency hammerspoon]
platform = macos
command = hs
installer = brew-cask
source = hammerspoon

[dependency terminal-notifier]
platform = macos
command = terminal-notifier
installer = brew
source = terminal-notifier

[link config]
platform = macos
mode = tree
source = configs/hammerspoon
target = ~/.hammerspoon
