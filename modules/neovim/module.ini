[module]
platforms = all
enabled = true
order = 10

[dependency neovim]
command = nvim
installer = brew
source = neovim

[dependency sqlite]
command = sqlite3
installer = brew
source = sqlite

# 配置本体是另一个仓库，clone 到 ~/.config/nvim，原因见 install.sh。
# command 对 script installer 不起作用（引擎只跑脚本的 check），但清单必填。
[dependency neovim-config]
command = nvim
installer = script
source = install.sh
