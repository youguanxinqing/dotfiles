# 只放跨机器稳定、由人维护的 Codex 偏好。
# 项目信任、插件生成内容、hook hash 和绝对路径留在本机 config.toml。
# approvals_reviewer 不放这里：/permissions 会把它写回 profile，改由 fish 的 codex 函数钉住。
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
notify = ["codex-notify"]
service_tier = "default"

[features]
hooks = true
js_repl = false

[tui]
status_line = ["model-with-reasoning", "project-name", "run-state", "context-used", "five-hour-limit", "weekly-limit", "estimated-thread-cost"]
status_line_use_colors = true

