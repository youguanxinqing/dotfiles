[module]
platforms = all
enabled = true
order = 50

# Codex 会把项目信任、插件注册、hook hash 等本机状态写进 ~/.codex/config.toml，
# 不能把那个文件直接链接进公开仓库。命名 profile 是 Codex 原生的配置层
# （`-p dotfiles` 叠在基础配置之上），由 Fish 的 codex 函数默认启用。
#
# copy 而不是软链：这一层不是只读的。Codex 把目录信任和 model_availability_nux
# 计数写回最顶层，也就是这个 profile 文件；软链等于把公开仓库的写权限交给它
# —— 实测被写进两个 /Users/... 绝对路径。copy 让这些写落在部署出去的那份上；
# 代价是每次 install 会用仓库那份盖掉漂移，写进 profile 的目录信任要重新确认。
[link profile]
mode = copy
source = modules/codex/dotfiles.config.toml
target = ~/.codex/dotfiles.config.toml
