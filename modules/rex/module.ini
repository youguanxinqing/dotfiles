# Rex 是 beta，不在 Homebrew，app 自己走 Sparkle 更新，所以这里没有 dependency，
# 只管 home/ 下的配置。Linux 上的 Rex server 也读 ~/.config/rex/init.lua，
# 真有那台机器再放开 platforms。
#
# themes/ 只是导入源：Rex 在 "Import Theme File" 那一刻把颜色抄进
# ~/Library/Preferences/com.superlogical.rex.plist（Workspace.customThemes），
# 之后不再读这些文件。新机器上要手动导入一次。
#
# 那份 plist 不进仓库：它是 app 自己写的，当前主题存的是本机生成的
# custom-<UUID>，换台机器没有意义；字体、tab 样式这几项在设置里重点一遍。
[module]
platforms = macos
