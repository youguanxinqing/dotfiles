[module]
platforms = all
enabled = true
order = 50

[link macos-config]
platform = macos
mode = tree
source = configs/ghostty
target = ~/Library/Application Support/com.mitchellh.ghostty

[link linux-config]
platform = linux
mode = entry
source = configs/ghostty/common.conf
target = ~/.config/ghostty/config
template = config-file = {source}
