# font-family = "ZedMono Nerd Font"
font-family = "LXGW WenKai Mono Screen"
font-family = "JetBrainsMono Nerd Font Mono"
font-size = 16
# theme = Everforest Dark Hard

# ghostty 默认 foreground = #ffffff，比它自己调色板里的 white (palette 7 = #c5c8c6)
# 还亮 —— 任何不带颜色的普通输出都被拉到纯白，在 #282c34 背景上刺眼。
# tmux 窗口看着舒服只是因为 .tmux.conf 里 window-style 'fg=colour247' 把它压过了
# (colour247 = #9e9e9e)，herdr 不做这种覆盖，于是默认值原样暴露出来。
# #9e9e9e 就是 colour247 本身，和 tmux 那半边 1:1。One Dark 的 #abb2bf 亮度更高但
# 带 +21 的蓝调（B-R），和 tmux 的中性灰摆一起能看出来色差。
foreground = #9e9e9e

# ghostty 默认 background = #282c34（One Dark），带 +12 的蓝调。
# #1d1f21 = palette 0，即 .tmux.conf 里 window-active-style 'bg=black' 的那个色 ——
# 也就是你在 tmux 里实际盯着的那个 pane 的背景。inactive pane 是 colour236 (#303030)，
# tmux 靠这两个背景的深浅区分焦点；ghostty 只有一个背景，所以取 active 那个。
background = #1d1f21

# ctrl+alt+u/d（滚半屏）故意不在这里：由 herdr 自己绑，见 configs/herdr/config.toml
# 的 herdr-half-page。这里曾经伪造滚轮事件（ESC[<64;1;999M x 8，行号取 999 落在所有
# pane 之外，吃 herdr「落空就滚焦点 pane」的兜底），herdr 0.9.0 把 wheel handler 从
# 三级（pane_at -> pane_frame_at -> 焦点 pane）砍成只剩第一级
# （src/client/shell/mouse.rs:2198，没有 else），落空的滚轮直接丢弃，按键静默失效。
# 滚轮事件现在按屏幕坐标寻址，而 ghostty 不知道哪个 pane 是焦点，所以这件事回不来。

# 这块键盘没有物理页键，留一对字面量 PageUp/PageDown 给需要真页键的 TUI。
keybind = ctrl+alt+shift+u=csi:5~
keybind = ctrl+alt+shift+d=csi:6~

# herdr 侧栏的状态圈（○ ● ✓ × ·）看着比正文大一号：这些码位是 East Asian
# Ambiguous，字体链里第一位的 LXGW WenKai 覆盖了它们，于是按全宽 CJK 字形画。
# 钉回 JetBrainsMono，字号才和旁边的英文一致。
# symbols 风格的 ◐ (U+25D0) 不在这里：JetBrainsMono 没有这个字形，映射过去也是回落。
font-codepoint-map = U+25CB-U+25CF=JetBrainsMono Nerd Font Mono
font-codepoint-map = U+00B7,U+00D7,U+2713=JetBrainsMono Nerd Font Mono
