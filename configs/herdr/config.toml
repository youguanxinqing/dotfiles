onboarding = false
[ui]
# "priority" = attention queue（要人管的排前面），不再按 workspace 分组。
# 同时挂 10 个 agent 时，按 space 分组等于要自己扫一遍找哪个在等我。
agent_panel_sort = "priority"

# agent 完成的通知不走 herdr：由 Claude Code 的 Stop hook -> bin/agent-done-toast
# -> Hammerspoon 右上角卡片负责，herdr 再弹一个是重复。
# 也试过 delivery = "herdr"（终端内浮层）：样式只能调 accent 和 panel_bg，且切出
# 终端就看不到，而这个通知的全部价值就在你没盯着终端的时候。
#
# 注意：off 之后 `herdr notification show` 一律返回
# {"shown":false,"reason":"disabled"} —— 脚本不要拿它当兜底，
# bin/herdr-agent-attention 踩过这个坑，现在退回 terminal-notifier。
[ui.toast]
delivery = "off"

[theme]
name = "nord"
auto_switch = false

# popup（scratch）的边框吃 palette.accent，不是 [ui] accent —— 后者在 herdr 0.8.2
# 里是 dead_code，只留着兼容旧配置，改了没有任何效果。nord 的 accent 是亮青
# #88c0d0，衬在暗底上又亮又抢眼；退到 nord10 (#5e81ac) 就安静下来。不能再往暗
# 走：accent 同时是 active tab 的底色（src/ui/tabs.rs:394 .bg(p.accent)），设成
# nord3 会正好撞上 inactive tab 的文字色 overlay0，整条 tab bar 糊成一片。
#
# panel_bg 是 popup 整个外框先刷的那层底色（nord #2e3440，比终端底色浅）。
# src/popup_size.rs 里 terminal_cols = inner_width - 1，右边硬编码留一列空槽，
# 露出的就是这层底 —— 所以右边看着是两条线。空槽改不掉，但把底色对齐 ghostty 的
# background (#1d1f21，见 configs/ghostty/config) 之后它就看不见了，边框只剩一格
# 单线。写死 hex 而不是 "reset"：reset 会让 panel_contrast_fg 回退到 surface_dim，
# active tab 的字就没对比度了（src/ui/widgets.rs panel_contrast_fg）。
# 代价：panel_bg 也管 tab bar 和各种浮层面板，它们会一起用终端底色。
[theme.custom]
accent = "#5e81ac"
panel_bg = "#1d1f21"

# Pane 切换。列表形式让两套键同时生效：
#   ctrl+alt+hjkl —— 直接按，不用先按 prefix，日常就用这个
#   prefix+hjkl   —— 保留默认键当退路（ghostty 只把 left-Option 当 alt）
# nvim 自己的 ctrl+w hjkl 不受影响，也没有抢走 shell 的 ctrl+l / ctrl+k。
[keys]
focus_pane_left  = ["prefix+h", "ctrl+alt+h"]
focus_pane_down  = ["prefix+j", "ctrl+alt+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# herdr 默认没绑 last_pane。工作 tab 基本都是 nvim | claude 两半，
# 在「刚才那个 pane」之间来回跳比按方向键更常用，方向键在 3~4 pane 的 tab 里才有意义。
last_pane = "ctrl+alt+o"

# prefix+alt+<数字> 跨 tab 跳到第 N 个 agent pane，N = 侧栏（prefix+b）里的行序。
# 数字看不见，得自己数行；同 tab 内的 pane 用 prefix+q 那个带列表的更省事。
focus_agent = "prefix+alt+1..9"

# detach 从 prefix+q 挪到 prefix+d（tmux 本来就是 prefix+d），把 prefix+q 让给
# 下面那个 display-panes 等价物 —— 保住 tmux 的肌肉记忆。
detach = "prefix+d"

# 建/关 tab 全部走下面的 herdr-smart-tab 绑定（同名 tab 分组编 ⅱⅲ 后缀，
# 每个 label 带 "N." 位置前缀，让 prefix+1..9 可预测）。禁用内建键，
# 否则绕过脚本建出来的 tab 编号会漂，要按 prefix+shift+r 手动修。
new_tab = ""
close_tab = ""

# herdr-navigator: prefix+t 开 fuzzy navigator，prefix+shift+L 跳回上一个 workspace。
# 避开了默认占用的 prefix+shift+t (rename_tab) 和 prefix+l (focus_pane_right)。
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "jump to previous workspace"

# 按名字模糊跳 tab（内建 prefix+1..9 到不了编号 >= 10 的 tab）。
[[keys.command]]
key = "prefix+f"
type = "popup"
# Herdr 是长驻进程，可能早于 shell 的 PATH 更新启动；使用 install.sh 发布的稳定路径。
command = "${HOME}/.local/bin/herdr-tab-jump"
width = "60%"
height = "50%"
description = "fuzzy jump to tab"

# tmux display-panes 的等价物：列出当前 tab 的 pane，按一个数字跳过去。
[[keys.command]]
key = "prefix+q"
type = "popup"
# 写死成格子数而不是百分比：百分比在大屏上会撑出一个几乎全空的大框。
# 实测可画行数 = height - 3（上下边框 + 顶部内边距各一行，再留一行防换行顶屏）。
# 10 => 7 行，够放见过的最多 6 个 pane；再多脚本会自己滚动，不会画到框外面去。
# 宽度和脚本里的 WIDTH 对齐。
command = "${HOME}/.local/bin/herdr-pane-jump"
width = 56
height = 10
description = "display panes and jump"

# grep-nvim: fzf + ripgrep live-grep，回车在右边 split 里用 nvim 打到那一行，退出自动收掉。
[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "grep-nvim.open"
description = "live-grep into nvim"

# resurrect: 崩溃/重启后把 pane 里跑的东西重新拉起来（herdr 自己只恢复壳和 cwd）。
# 存快照是事件驱动自动做的，不用绑键；autoRestore 保持 false，恢复只在你按这个键时发生。
# 想先看计划: herdr plugin action invoke ntindle.herdr-resurrect.restore-preview
[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore last snapshot"

# reviewr: 在 agent 旁边开一个 review pane，读 diff、选行、写评论、一键发回给 agent。
# 用 cmd+r 而不是 prefix+…: 它是 review 过程中反复开关的，直接键更顺手；
# ghostty 默认没占 cmd+r（`ghostty +list-keybinds` 查过），alt+ 系列反而会被终端吞掉。
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr pane"

# herdr-smart-tab: tmux 式建 tab（i=前 a=后 I=最前 A=最后），同名分组自动编号。
# 脚本来自 griffinqiu/dotfiles。type=shell 由 server 直接跑，PATH 不可靠，
# 所以使用 install.sh 发布到 ~/.local/bin 的绝对路径。
[[keys.command]]
key = "prefix+i"
type = "shell"
command = '"${HOME}/.local/bin/herdr-smart-tab" before'
description = "new tab before current (tmux i)"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = '"${HOME}/.local/bin/herdr-smart-tab" after'
description = "new tab after current (tmux a)"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = '"${HOME}/.local/bin/herdr-smart-tab" first'
description = "new tab at beginning (tmux I)"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = '"${HOME}/.local/bin/herdr-smart-tab" last'
description = "new tab at end (tmux A)"

# prefix+c 是被上面 new_tab = "" 禁掉的默认建 tab 键，接回脚本保住肌肉记忆。
# 语义同 tmux c：建到最后，但走 plain —— 不继承任何组名，label 只剩位置序号
# ("5.")。i/a/I/A 是"再来一个同类"，继承组名是对的；c 是"开个新的"，继承等于
# 每次建完都要改名。不经过 herdr 内建的建 tab 弹窗，按下去就有。
[[keys.command]]
key = "prefix+c"
type = "shell"
command = '"${HOME}/.local/bin/herdr-smart-tab" plain'
description = "new tab at end, unnamed (tmux c)"

[[keys.command]]
key = "prefix+x"
type = "shell"
command = '"${HOME}/.local/bin/herdr-smart-tab" close-pane'
description = "close pane and renumber"

[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = '"${HOME}/.local/bin/herdr-smart-tab" close-tab'
description = "close tab and renumber"

# 手动修复键：拖拽换过 tab 顺序、或有 tab 绕过脚本创建时按一下，顺便 reload 配置。
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" server reload-config && "${HOME}/.local/bin/herdr-smart-tab" renumber-all'
description = "reload config and renumber tabs"

# herdr-scratch: 浮空 scratchpad，nvim toggleterm 的等价物。shell 活在插件私有的
# herdr-scratch session 里，prefix+q 收起来只是脱离浮层，进程和滚动历史都还在，
# 再按 prefix+g 原样回来。默认 workspace 作用域，每个 workspace 一个自己的 scratchpad。
# 内建的 type = "popup" 做不到这个：命令退出即销毁。
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "herdr.scratch.toggle"
description = "toggle scratchpad"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr.scratch.lazygit"
description = "toggle lazygit scratchpad"

# Pluck: 镜像当前可见画面，给路径、URL、SHA、IP 等 token 标短 hint，选中即复制。
# 上游示例的 prefix+q 已被 pane picker 使用，复用 Talon 腾出的 prefix+space。
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "pluck visible token"

# 跳到下一个 blocked / done 的 agent，连按循环。working / idle 的一律不跳 ——
# 内建 next_agent 会把它们一起轮进来，挂 10 个的时候要多按好几下。
[[keys.command]]
key = "prefix+u"
type = "shell"
command = '"${HOME}/.local/bin/herdr-agent-attention"'
description = "jump to next blocked or done agent"

# agents 面板的 workspace 名默认恒定加粗（sidebar.rs 里未选中分支也 add_modifier(BOLD)），
# spaces 面板未选中行则不加粗，两个面板看起来不是一套东西。去掉粗体对齐 spaces。
# 代价：当前活跃的那行也不再加粗，靠背景高亮 + 更亮的前景色区分。
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "workspace", bold = false }, "tab"],
  ["agent"],
]
